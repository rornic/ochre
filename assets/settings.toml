[renderer]
render_distance = 1024
full_detail_distance = 12
lod_level_scale = 2
lod_base_distance = 16
lod_fade_seconds = 1.5
# Blocks before a painted material repeats (a power of two up to 64), and its anisotropic filtering taps (1 to 16).
material_period = 8
material_anisotropy = 8

[sky]
# How far the sun casts shadows, in chunks, in how many slices, and each slice's map size in texels (4096 is crisper and costs frame time).
shadow_distance = 64
shadow_cascades = 4
shadow_resolution = 2048

[plugins]
frost = true
# Light shafts from a low sun, which cost frame time.
godrays = true

[debug]
still_leaves = false
solid_leaves = false

[world]
size = 65536
map_cell = 32

[world.bounds]
min_y = -1024
max_y = 2048

[world.tectonics]
plates = 12
relief = 1.0

[world.climate]
# Regional sea-level warmth (0..1); wind points in the direction air travels.
warmth = 0.68
wind_x = 1.0
wind_z = 0.15
# Multiplies the rain biome moisture sees (1 = unchanged).
humidity = 1.0
# How much warmer one side of the world is (along gradient_angle, radians), and how much warmer
# the far interior is than the coast.
gradient = 0.0
gradient_angle = 0.0
continentality = 0.0
